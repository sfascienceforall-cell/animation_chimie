<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFA — Animations capsule @@CODE@@</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* ===================== CHARTE SFA ===================== */
:root{
  --sfa:#1D4ED8;          /* bleu SFA */
  --deep:#0A2A6E;         /* bleu profond */
  --ink:#111111;          /* noir */
  --ink2:#3F3F46;         /* gris de lecture */
  --grey:#8A8F98;         /* gris léger */
  --bg:#FFFFFF;
  --tint:#E9EEFC;         /* bleu 8 % */
  --tint2:#D3DEFA;        /* bleu 18 % */
  --surface:#F4F6FA;
  --rule:#E3E7EE;
  --font:"Be Vietnam Pro","Segoe UI",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body,body *{font-feature-settings:"frac" 0,"afrc" 0,"dlig" 0,"hlig" 0}
html,body{height:100%;background:#0E1116;overflow:hidden;font-family:var(--font)}

#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#frame{flex:none;width:1600px;height:900px;background:var(--bg);position:relative;overflow:hidden;
  transform-origin:center center;box-shadow:0 0 60px rgba(0,0,0,.55)}

/* zone réservée au médaillon visage (haut-gauche) */
#safe{position:absolute;left:0;top:0;width:340px;height:200px;pointer-events:none}
body.guides #safe{outline:2px dashed rgba(29,78,216,.45);outline-offset:-8px}
body.guides #safe::after{content:"zone médaillon visage";position:absolute;left:16px;bottom:12px;
  font-size:12px;font-weight:600;color:var(--sfa);letter-spacing:.1em;text-transform:uppercase}
body.guides .body{outline:1px dashed rgba(138,143,152,.5)}

/* ===================== LOGO SFA (chaque page) ===================== */
/* REMPLACER PAR LE VRAI LOGO : <img src="logo-sfa.svg" style="height:44px"> */
.logo{position:absolute;right:56px;top:44px;display:flex;align-items:center;gap:13px;z-index:5}
.logo .mark{width:44px;height:44px;border-radius:10px;background:var(--sfa);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;letter-spacing:.03em}
.logo b{display:block;font-size:16px;font-weight:700;color:var(--ink);line-height:1.2}
.logo span{display:block;font-size:9px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--grey)}

/* ===================== ENTÊTE ===================== */
.head{position:absolute;left:380px;top:48px;right:300px;height:130px}
.head .ref{font-size:12px;font-weight:700;letter-spacing:.24em;color:var(--sfa);display:block;margin-bottom:9px}
.head h1{font-size:38px;line-height:1.08;letter-spacing:-.02em;font-weight:700;color:var(--ink)}
.head .sub{margin-top:7px;font-size:18px;font-weight:400;color:var(--ink2)}

/* ===================== CORPS ===================== */
.body{position:absolute;left:88px;right:88px;top:206px;bottom:152px}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .2s}
.slide.on{opacity:1;pointer-events:auto}
.mid{height:100%;display:flex;align-items:stretch}
.split{display:flex;gap:44px;width:100%;align-items:stretch}
.split>.col{align-self:stretch}
.split>.col:first-child{align-items:center}
.split>.col:first-child>svg{width:100%;height:auto;max-height:100%}
.col{min-width:0}

/* ===================== PIED ===================== */
.foot{position:absolute;left:88px;right:88px;bottom:52px;height:88px;
  border-top:1px solid var(--rule);padding-top:20px;display:flex;align-items:flex-start;gap:28px}
.caption{flex:1;font-size:21px;line-height:1.45;color:var(--ink2);font-weight:400}
.caption b{color:var(--ink);font-weight:600}
.caption em{font-style:normal;color:var(--deep);font-weight:700}
.dots{display:flex;gap:7px;flex:none;padding-top:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#D5DAE3;transition:.2s}
.dot.on{background:var(--sfa);transform:scale(1.4)}
.counter{font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--grey);flex:none;padding-top:5px;width:52px;text-align:right}

/* ===================== ANIMATION : apparition / disparition ===================== */
.step{opacity:0;transition:opacity .28s ease, transform .32s ease}
.step.on{opacity:1}
.rise{transform:translateY(12px)} .rise.on{transform:translateY(0)}
.gone{display:none !important}

/* ===================== BLOCS ===================== */
.expr{font-size:44px;font-weight:500;color:var(--ink);text-align:center;line-height:1.5;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.expr sup{font-size:.58em;vertical-align:super;line-height:0}
.expr .hl{background:var(--tint2);border-radius:8px;padding:3px 11px}
.expr .res{color:var(--sfa);font-weight:700}
.arr{text-align:center;font-size:22px;color:var(--grey);line-height:1.6}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:19px 24px}
.card h3{font-size:19px;font-weight:700;margin-bottom:9px;letter-spacing:-.01em;color:var(--ink)}
.card p,.card li{font-size:18px;line-height:1.48;color:var(--ink2)}
.card.acc{background:var(--tint);border-color:var(--tint2)}
.card.deep{background:var(--deep);border-color:var(--deep)}
.card.deep h3{color:#fff}
.card.deep p,.card.deep li{color:#C9D6F5}
.card.deep b{color:#fff}
.ol{list-style:none}
.ol li{padding:3px 0}
.ol li b{color:var(--sfa);font-weight:700;margin-right:8px}

.kv{text-align:center}
.kv .l{font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);margin-bottom:8px}
.kv .v{font-size:36px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.kv .v sup{font-size:.58em;vertical-align:super;line-height:0}
.kv.on-deep .l{color:#8FA9E8} .kv.on-deep .v{color:#fff}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}

/* blocs de facteurs */
.blocks{display:flex;gap:7px;justify-content:center;align-items:center}
.blk{width:42px;height:42px;border-radius:8px;background:var(--tint);border:2px solid var(--sfa);
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;color:var(--sfa)}
.blk.d{background:var(--tint2);border-color:var(--deep);color:var(--deep)}
.blocks .x{font-size:22px;color:var(--grey);margin:0 6px;font-weight:600}

/* ===================== DIVISION EUCLIDIENNE (grille alignée) ===================== */
.div{display:grid;grid-template-columns:repeat(4,128px) 26px 1fr;
  align-items:center;font-size:26px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;row-gap:0}
.div .c{text-align:right;padding:5px 10px}
.div .c sup{font-size:.58em;vertical-align:super;line-height:0}
.div .neg{color:var(--sfa)}
.div .bar{grid-column:6;border-left:2px solid var(--rule);align-self:stretch}
.div .vl{grid-column:5;border-left:2px solid var(--rule);align-self:stretch;min-height:34px}
.div .q{grid-column:6;padding-left:22px;color:var(--sfa);font-weight:700;text-align:left}
.div .rule{height:2px;background:var(--ink);border-radius:2px;margin:3px 8px 6px}
.div .zero{color:var(--sfa);font-weight:700}

/* ===================== BARRES ===================== */
.bars{display:flex;align-items:flex-end;justify-content:center;gap:54px;height:236px}
.barwrap{width:132px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar{width:100%;background:var(--sfa);border-radius:10px 10px 0 0;transition:height .55s cubic-bezier(.4,0,.2,1)}
.bar.d{background:var(--deep)}
.barwrap .v{font-size:24px;font-weight:700;color:var(--ink);margin-bottom:10px;font-variant-numeric:tabular-nums}
.barlbl{display:flex;justify-content:center;gap:54px;margin-top:14px}
.barlbl div{width:132px;text-align:center;font-size:16px;color:var(--grey);font-weight:500}
.opwrap{width:96px;display:flex;align-items:center;justify-content:center;height:100%;padding-bottom:82px}
.op{font-size:20px;font-weight:700;color:var(--sfa);background:var(--tint);padding:8px 14px;border-radius:9px;
  font-variant-numeric:tabular-nums}

/* ===================== AIDE / SOMMAIRE ===================== */
#help{position:absolute;right:56px;bottom:22px;font-size:12px;font-weight:500;color:var(--grey);z-index:6;letter-spacing:.04em}
#toc{position:fixed;inset:0;background:rgba(10,17,22,.96);color:#fff;display:none;z-index:20;padding:80px 110px;overflow:auto}
#toc.on{display:block}
#toc h2{font-size:28px;font-weight:700;margin-bottom:28px}
#toc li{list-style:none;font-size:19px;padding:13px 0;border-bottom:1px solid #232A36;cursor:pointer;font-weight:500}
#toc li:hover{color:#8FA9E8}
#toc code{font-family:var(--font);font-size:14px;font-weight:700;letter-spacing:.18em;color:#6E93F0;margin-right:18px}
</style></head>
<body>

<div id="stage"><div id="frame">
  <div id="safe"></div>

  <!-- ===== LOGO SFA — présent sur chaque page ===== -->
  <div class="logo"><div class="mark">SFA</div><div><b>Science For All</b><span>Prépa médecine</span></div></div>

  <div class="head"><span class="ref" id="ref"></span><h1 id="title"></h1><div class="sub" id="sub"></div></div>

  <div class="body">
@@SLIDES@@
  </div>

  <div class="foot">
    <div class="caption" id="cap"></div>
    <div class="dots" id="dots"></div>
    <div class="counter" id="cnt"></div>
  </div>
  <div id="help">← → étapes · ↑ ↓ animations · S sommaire · G repères</div>
</div></div>

<div id="toc"><h2>@@TOC@@</h2><ul id="toclist"></ul></div>

<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll('.slide'));
  var caps=slides.map(function(s){try{return JSON.parse(s.querySelector('.caps').textContent);}catch(e){return[];}});
  var cur=0, step=0;
  function total(i){return parseInt(slides[i].dataset.steps,10)||1;}

  function applySteps(s, st){
    [].forEach.call(s.querySelectorAll('.step'),function(el){
      var app=1, hide=99;
      (el.getAttribute('class')||'').split(/\s+/).forEach(function(c){
        var a=/^s(\d+)$/.exec(c); if(a) app=+a[1];
        var h=/^h(\d+)$/.exec(c); if(h) hide=+h[1];
      });
      var k=st+1;
      el.classList.toggle('on', k>=app);
      el.classList.toggle('gone', k>=hide);
    });
  }

  /* --- mise a l'echelle automatique des colonnes -------------------------
     On mesure la hauteur reelle de chaque colonne a CHACUNE des etapes de la
     diapositive (une carte qui disparait ne doit pas compter), on garde le
     maximum, et si ca deborde de la zone utile on reduit la colonne juste ce
     qu'il faut. Aucune carte ne peut donc passer sous le filet du pied. */
  function autofit(){
    var zone=document.querySelector('.body');
    var avail=zone.clientHeight;
    slides.forEach(function(s){
      /* seules les colonnes de texte sont mises a l'echelle : une figure SVG
         est deja bornee par max-height et n'a jamais besoin d'etre reduite. */
      var cols=[].slice.call(s.querySelectorAll('.col')).filter(function(c){
        return c.querySelector('.card, .expr, .kv, table');
      });
      if(!cols.length) cols=[s.querySelector('.mid')].filter(Boolean);
      cols.forEach(function(c){c.style.zoom='';});
      var need=cols.map(function(){return 0;});
      var T=parseInt(s.dataset.steps,10)||1;
      for(var k=0;k<T;k++){
        applySteps(s,k);
        cols.forEach(function(c,i){
          /* scrollHeight = hauteur du CONTENU. getBoundingClientRect ne donne
             que la boite attribuee par le flex, qui peut etre plus petite : le
             contenu deborde alors sans que la mesure le voie. */
          var h=Math.max(c.scrollHeight, c.getBoundingClientRect().height);
          if(h>need[i]) need[i]=h;
        });
      }
      cols.forEach(function(c,i){
        if(!need[i]) return;
        /* on vise avail-6 : six pixels de garde sous la derniere carte, pour
           qu'aucun arrondi ne puisse la faire toucher le filet du pied. */
        var r=(avail-6)/need[i];
        if(r<0.999) c.style.zoom=Math.max(0.70, r).toFixed(4);
      });
      applySteps(s,0);
    });
  }

  function render(){
    slides.forEach(function(s,i){s.classList.toggle('on',i===cur);});
    var s=slides[cur];
    document.getElementById('ref').textContent=s.dataset.ref;
    document.getElementById('title').textContent=s.dataset.title;
    document.getElementById('sub').textContent=s.dataset.sub||'';
    applySteps(s, step);
    document.getElementById('cap').innerHTML=caps[cur][step]||'';
    var d=document.getElementById('dots'); d.innerHTML='';
    for(var i=0;i<total(cur);i++){var e=document.createElement('div');e.className='dot'+(i<=step?' on':'');d.appendChild(e);}
    document.getElementById('cnt').textContent=(cur+1)+'/'+slides.length;
  }
  function next(){ if(step<total(cur)-1){step++;} else if(cur<slides.length-1){cur++;step=0;} render(); }
  function prev(){ if(step>0){step--;} else if(cur>0){cur--;step=total(cur)-1;} render(); }
  function go(i){cur=i;step=0;render();}

  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='ArrowDown'){e.preventDefault();if(cur<slides.length-1)go(cur+1);}
    else if(k==='ArrowUp'){e.preventDefault();if(cur>0)go(cur-1);}
    else if(k==='Home'){go(0);}
    else if(k.toLowerCase&&k.toLowerCase()==='g'){document.body.classList.toggle('guides');}
    else if(k.toLowerCase&&k.toLowerCase()==='s'){document.getElementById('toc').classList.toggle('on');}
    else if(k==='Escape'){document.getElementById('toc').classList.remove('on');}
    else if(/^[1-9]$/.test(k)){var i=+k-1;if(i<slides.length){go(i);document.getElementById('toc').classList.remove('on');}}
  });
  document.getElementById('frame').addEventListener('click',function(e){
    var r=this.getBoundingClientRect();
    if(e.clientX < r.left + r.width*0.22){prev();}else{next();}
  });

  var tl=document.getElementById('toclist');
  slides.forEach(function(s,i){
    var li=document.createElement('li');
    li.innerHTML='<code>'+s.dataset.ref+'</code>'+s.dataset.title;
    li.onclick=function(){go(i);document.getElementById('toc').classList.remove('on');};
    tl.appendChild(li);
  });

  function fit(){
    var k=Math.min(window.innerWidth/1600, window.innerHeight/900);
    document.getElementById('frame').style.transform='scale('+k+')';
  }
  window.addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){autofit();fit();render();});}
  fit(); autofit(); render();
})();
</script>
</body></html>
